<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Administración — La Blanquita del Barrio</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#EBE6DA">
  <link rel="icon" href="/assets/lb_logo_trim.png" type="image/png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/styles.css">
</head>

<body class="min-h-screen flex flex-col">

  <!-- ===================================================================
       Login
       =================================================================== -->
  <section id="loginSection" class="fixed inset-0 z-60 flex items-center justify-center p-5">
    <div class="panel w-full max-w-sm p-8">
      <div class="text-center">
        <img src="/assets/lb_logo_trim.png" alt="" width="512" height="435" class="w-16 h-auto mx-auto">
        <h1 class="display mt-5 text-2xl">Panel de administración</h1>
        <p class="prose-warm mt-1 text-sm">Ingresá tus credenciales para continuar.</p>
      </div>

      <div class="ornament my-7"><span></span></div>

      <form id="loginForm" class="space-y-4" novalidate>
        <div>
          <label for="username" class="eyebrow block mb-1.5">Usuario</label>
          <input type="text" id="username" name="username" class="field" autocomplete="username" required>
        </div>
        <div>
          <label for="password" class="eyebrow block mb-1.5">Contraseña</label>
          <input type="password" id="password" name="password" class="field" autocomplete="current-password" required>
        </div>
        <button type="submit" id="loginBtn" class="btn btn-brand w-full mt-2">Ingresar</button>
      </form>

      <p id="loginError" class="hidden mt-4 text-sm text-center text-coral" role="alert"></p>
    </div>
  </section>

  <!-- ===================================================================
       Panel
       =================================================================== -->
  <div id="adminPanel" class="hidden grow flex-col">

    <header class="sticky top-0 z-50 bg-crema/95 backdrop-blur-sm border-b border-rule">
      <div class="mx-auto max-w-4xl px-5 sm:px-8 flex items-center justify-between gap-4 py-3">
        <div class="flex items-center gap-3 min-w-0">
          <img src="/assets/lb_logo_trim.png" alt="" width="512" height="435" class="w-10 h-auto shrink-0">
          <span class="leading-none min-w-0">
            <span class="display block text-[1.0625rem] truncate">Panel de administración</span>
            <span class="eyebrow mt-1 block text-[0.625rem]">Gestión de precios</span>
          </span>
        </div>
        <button type="button" id="logoutBtn" class="nav-link text-sm shrink-0">Cerrar sesión</button>
      </div>
    </header>

    <main class="grow mx-auto w-full max-w-4xl px-5 sm:px-8 py-10 sm:py-14">

      <div class="flex flex-wrap items-end justify-between gap-4">
        <div>
          <p class="eyebrow">Catálogo</p>
          <h2 class="display mt-2 text-3xl sm:text-4xl">Productos</h2>
        </div>
        <div class="flex gap-2">
        <button type="button" id="sortBtn" class="btn btn-outline" aria-pressed="false">
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M7 4v16m0 0l-3-3m3 3l3-3M17 20V4m0 0l-3 3m3-3l3 3"/>
          </svg>
          <span>Ordenar</span>
        </button>
        <button type="button" id="newBtn" class="btn btn-brand">
          <svg width="16" height="16" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
            <path fill-rule="evenodd"
              d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z"
              clip-rule="evenodd" />
          </svg>
          Nuevo producto
        </button>
        </div>
      </div>

      <div class="mt-8">
        <label for="adminSearchInput" class="sr-only">Buscar productos</label>
        <div class="relative">
          <svg class="pointer-events-none absolute left-3.5 top-1/2 -translate-y-1/2 text-ink-3" width="17" height="17"
            viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
            <path fill-rule="evenodd"
              d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z"
              clip-rule="evenodd" />
          </svg>
          <input type="search" id="adminSearchInput" class="field pl-10" placeholder="Buscar producto..."
            autocomplete="off">
        </div>
      </div>

      <p id="adminCount" class="eyebrow mt-4 h-4" aria-live="polite"></p>

      <div class="panel mt-3 px-4 sm:px-6 py-2">
        <ul id="adminList" class="divide-y divide-rule/60"></ul>
      </div>

      <p id="statusMsg" class="hidden mt-4 text-sm text-center" role="status"></p>
    </main>
  </div>

  <!-- ===================================================================
       Modal alta / edición
       =================================================================== -->
  <div id="productModal" class="hidden fixed inset-0 z-50">
    <!-- Velo sólido, sin backdrop-blur: el header sticky de abajo ya tiene su
         propio backdrop-filter y dos capas superpuestas fantasmean el texto. -->
    <div id="modalBackdrop" class="absolute inset-0 bg-ink/55"></div>

    <div class="absolute inset-0 overflow-y-auto p-5 flex items-center justify-center">
      <div class="panel relative w-full max-w-md p-6 sm:p-8" role="dialog" aria-modal="true"
        aria-labelledby="modalTitle">
        <h3 id="modalTitle" class="display text-2xl">Nuevo producto</h3>
        <div class="ornament my-6"><span></span></div>

        <form id="productForm" class="space-y-5">
          <input type="hidden" id="productId">

          <div>
            <label for="prodName" class="eyebrow block mb-1.5">Nombre</label>
            <input type="text" id="prodName" class="field" required autocomplete="off">
          </div>

          <div class="grid grid-cols-2 gap-4">
            <div>
              <label for="prodUnit" class="eyebrow block mb-1.5">Unidad</label>
              <input type="text" id="prodUnit" class="field" list="units" required placeholder="kg" autocomplete="off">
              <datalist id="units">
                <option value="kg"></option>
                <option value="500g"></option>
                <option value="unidad"></option>
                <option value="docena"></option>
                <option value="plancha"></option>
                <option value="caja"></option>
              </datalist>
            </div>
            <div>
              <label for="prodPrice" class="eyebrow block mb-1.5">Precio</label>
              <input type="number" id="prodPrice" class="field tnum" required min="0" step="0.01" inputmode="decimal">
            </div>
          </div>

          <div>
            <label for="flavorInput" class="eyebrow block mb-1.5">Sabores <span class="normal-case tracking-normal font-normal text-ink-3">(opcional)</span></label>
            <div class="flex gap-2">
              <input type="text" id="flavorInput" class="field" list="flavorSuggestions" placeholder="Ej: Ricota y nuez"
                autocomplete="off" enterkeyhint="done">
              <datalist id="flavorSuggestions"></datalist>
              <button type="button" id="addFlavorBtn" class="btn btn-outline shrink-0 px-4" aria-label="Agregar sabor">
                <svg width="16" height="16" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                  <path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd" />
                </svg>
              </button>
            </div>
            <p class="mt-1.5 text-xs text-ink-3">Escribí un gusto y tocá + (o Enter). Usan el mismo precio del producto.</p>
            <ul id="flavorChips" class="mt-3 flex flex-wrap gap-2" aria-label="Sabores cargados"></ul>
          </div>

          <p id="modalError" class="hidden text-sm text-coral" role="alert"></p>

          <div class="flex gap-3 pt-2">
            <button type="button" id="cancelBtn" class="btn btn-outline flex-1">Cancelar</button>
            <button type="submit" id="saveBtn" class="btn btn-brand flex-1">Guardar</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script type="module">
    const API_URL = import.meta.env.VITE_API_URL || 'http://localhost:3000';

    const $ = (id) => document.getElementById(id);

    const loginSection = $('loginSection');
    const loginForm = $('loginForm');
    const loginBtn = $('loginBtn');
    const loginError = $('loginError');

    const adminPanel = $('adminPanel');
    const list = $('adminList');
    const countLabel = $('adminCount');
    const searchInput = $('adminSearchInput');
    const statusMsg = $('statusMsg');

    const modal = $('productModal');
    const productForm = $('productForm');
    const modalTitle = $('modalTitle');
    const modalError = $('modalError');
    const productId = $('productId');
    const saveBtn = $('saveBtn');

    let products = [];
    let lastFocused = null;
    let sorting = false; // modo "Ordenar": flechas en vez de editar/borrar
    const sortBtn = $('sortBtn');
    let flavors = []; // sabores del producto que se está editando

    const flavorInput = $('flavorInput');
    const flavorChips = $('flavorChips');

    /* --------------------------------------------------------------- Sabores */

    const capitalize = (s) => s.charAt(0).toLocaleUpperCase('es') + s.slice(1);

    function renderFlavors() {
      flavorChips.innerHTML = flavors.map((f, i) => `
        <li class="inline-flex items-center gap-1 pl-3 pr-1 py-1 rounded-full bg-brand-wash text-brand-deep text-sm">
          ${esc(f)}
          <button type="button" data-remove-flavor="${i}" class="size-6 grid place-items-center rounded-full hover:bg-white/70"
            aria-label="Quitar ${esc(f)}">
            <svg width="12" height="12" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
              <path fill-rule="evenodd" d="M4.3 4.3a1 1 0 011.4 0L10 8.6l4.3-4.3a1 1 0 111.4 1.4L11.4 10l4.3 4.3a1 1 0 01-1.4 1.4L10 11.4l-4.3 4.3a1 1 0 01-1.4-1.4L8.6 10 4.3 5.7a1 1 0 010-1.4z" clip-rule="evenodd" />
            </svg>
          </button>
        </li>`).join('');
    }

    function addFlavor() {
      const value = capitalize(flavorInput.value.trim().replace(/\s+/g, ' '));
      if (!value) return;
      const exists = flavors.some((f) => f.toLocaleLowerCase('es') === value.toLocaleLowerCase('es'));
      if (!exists) flavors.push(value);
      flavorInput.value = '';
      renderFlavors();
      flavorInput.focus();
    }

    // Sugiere los sabores que ya se usan en otros productos.
    function fillFlavorSuggestions() {
      const all = [...new Set(products.flatMap((p) => p.sabores || []))]
        .sort((a, b) => a.localeCompare(b, 'es'));
      $('flavorSuggestions').innerHTML = all.map((f) => `<option value="${esc(f)}"></option>`).join('');
    }

    $('addFlavorBtn').addEventListener('click', addFlavor);

    // Enter dentro del campo de sabor agrega el sabor, no guarda el formulario.
    flavorInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        addFlavor();
      }
    });

    flavorChips.addEventListener('click', (e) => {
      const btn = e.target.closest('[data-remove-flavor]');
      if (!btn) return;
      flavors.splice(Number(btn.dataset.removeFlavor), 1);
      renderFlavors();
      flavorInput.focus();
    });

    const money = new Intl.NumberFormat('es-AR', {
      style: 'currency',
      currency: 'ARS',
      maximumFractionDigits: 0
    });

    const esc = (value) =>
      String(value ?? '').replace(/[&<>"']/g, (c) => (
        { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
      ));

    function showStatus(text, ok = true) {
      statusMsg.textContent = text;
      statusMsg.className = `mt-4 text-sm text-center ${ok ? 'text-verde' : 'text-coral'}`;
      clearTimeout(showStatus.timer);
      showStatus.timer = setTimeout(() => statusMsg.classList.add('hidden'), 3500);
    }

    function showFieldError(el, text) {
      el.textContent = text;
      el.classList.remove('hidden');
    }

    /* ---------------------------------------------------------------- Sesión */

    function openPanel() {
      loginSection.classList.add('hidden');
      adminPanel.classList.remove('hidden');
      adminPanel.classList.add('flex');
      loadProducts();
    }

    if (localStorage.getItem('lb_auth') === 'true') openPanel();

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      loginError.classList.add('hidden');
      loginBtn.disabled = true;
      loginBtn.textContent = 'Verificando…';

      try {
        const res = await fetch(`${API_URL}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: $('username').value,
            password: $('password').value
          })
        });
        const data = await res.json().catch(() => ({}));

        if (!res.ok) {
          showFieldError(loginError, data.error || 'Credenciales incorrectas.');
          return;
        }
        localStorage.setItem('lb_auth', 'true');
        openPanel();
      } catch (err) {
        console.error(err);
        showFieldError(loginError, 'No pudimos conectar con el servidor.');
      } finally {
        loginBtn.disabled = false;
        loginBtn.textContent = 'Ingresar';
      }
    });

    $('logoutBtn').addEventListener('click', () => {
      localStorage.removeItem('lb_auth');
      location.reload();
    });

    /* ---------------------------------------------------------------- Render */

    function renderSkeleton() {
      list.innerHTML = Array.from({ length: 6 }, () => `
        <li class="py-4 animate-pulse flex items-center gap-4">
          <div class="h-3.5 bg-rule/50 rounded w-1/3"></div>
          <div class="h-3.5 bg-rule/30 rounded flex-1"></div>
          <div class="h-8 bg-rule/40 rounded w-20"></div>
        </li>
      `).join('');
    }

    function render() {
      const term = searchInput.value.trim().toLowerCase();
      const filtered = term
        ? products.filter((p) => String(p.nombre).toLowerCase().includes(term)
          || (p.sabores || []).some((f) => f.toLowerCase().includes(term)))
        : products;

      countLabel.textContent = products.length
        ? `${filtered.length} de ${products.length} ${products.length === 1 ? 'producto' : 'productos'}`
        : '';

      if (!filtered.length) {
        list.innerHTML = `<li class="py-10 text-center text-ink-3">${products.length
          ? 'No encontramos productos con ese nombre.'
          : 'Todavía no hay productos cargados.'}</li>`;
        return;
      }

      list.innerHTML = filtered.map((p, i) => `
        <li class="py-3 flex items-center gap-3">
          <span class="min-w-0 grow">
            <span class="block text-ink truncate">${esc(p.nombre)}</span>
            <span class="eyebrow mt-1 block">${esc(p.unidad)}${p.sabores?.length
              ? ` <span class="normal-case tracking-normal font-normal text-ink-3">· ${p.sabores.length} ${p.sabores.length === 1 ? 'sabor' : 'sabores'}</span>`
              : ''}</span>
          </span>
          <span class="display tnum text-brand shrink-0">${esc(money.format(p.precio))}</span>
          ${sorting ? sortControls(p, i, filtered.length) : `<span class="flex gap-1 shrink-0">
            <button type="button" data-action="edit" data-id="${esc(p.id)}"
              class="p-2 rounded text-ink-2 hover:text-brand hover:bg-crema-deep transition-colors"
              aria-label="Editar ${esc(p.nombre)}">
              <svg width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15.2 5.2l3.6 3.6M16.7 3.7a2.5 2.5 0 113.6 3.6L6.5 21H3v-3.5L16.7 3.7z"/>
              </svg>
            </button>
            <button type="button" data-action="delete" data-id="${esc(p.id)}"
              class="p-2 rounded text-ink-2 hover:text-coral hover:bg-crema-deep transition-colors"
              aria-label="Eliminar ${esc(p.nombre)}">
              <svg width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.9 12.1a2 2 0 01-2 1.9H7.9a2 2 0 01-2-1.9L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
              </svg>
            </button>
          </span>`}
        </li>
      `).join('');
    }

    /* --------------------------------------------------------------- Ordenar */

    function sortControls(p, i, total) {
      const arrow = (dir, d, disabled) => `
        <button type="button" data-action="${dir}" data-id="${esc(p.id)}" ${disabled ? 'disabled' : ''}
          class="p-2 rounded text-ink-2 hover:text-brand hover:bg-crema-deep transition-colors disabled:opacity-30 disabled:pointer-events-none"
          aria-label="${dir === 'up' ? 'Subir' : 'Bajar'} ${esc(p.nombre)}">
          <svg width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="${d}"/>
          </svg>
        </button>`;
      return `<span class="flex gap-1 shrink-0">
        ${arrow('up', 'M5 15l7-7 7 7', i === 0)}
        ${arrow('down', 'M19 9l-7 7-7-7', i === total - 1)}
      </span>`;
    }

    function setSorting(on) {
      sorting = on;
      sortBtn.setAttribute('aria-pressed', String(on));
      sortBtn.querySelector('span').textContent = on ? 'Listo' : 'Ordenar';
      sortBtn.classList.toggle('btn-brand', on);
      sortBtn.classList.toggle('btn-outline', !on);
      $('newBtn').classList.toggle('hidden', on);
      // Con un filtro activo, mover "uno arriba" sería ambiguo: se ordena la lista completa.
      searchInput.value = '';
      searchInput.disabled = on;
      if (!on) saveOrder.flush();
      render();
    }

    // Guarda el orden un ratito después del último movimiento, así varios
    // clics seguidos son un solo pedido.
    const saveOrder = (() => {
      let timer = null;
      const run = async () => {
        timer = null;
        try {
          await send('PUT', '/products/order', { ids: products.map((p) => p.id) });
          showStatus('Orden guardado.');
        } catch (err) {
          console.error(err);
          showStatus(`No se pudo guardar el orden: ${err.message}`, false);
        }
      };
      const schedule = () => { clearTimeout(timer); timer = setTimeout(run, 700); };
      schedule.flush = () => { if (timer) { clearTimeout(timer); run(); } };
      return schedule;
    })();

    function move(id, delta) {
      const from = products.findIndex((p) => String(p.id) === String(id));
      const to = from + delta;
      if (from < 0 || to < 0 || to >= products.length) return;
      const [item] = products.splice(from, 1);
      products.splice(to, 0, item);
      render();
      saveOrder();

      // Que el foco siga al producto movido (si llegó a un extremo, a la otra flecha).
      const dir = delta < 0 ? 'up' : 'down';
      const same = list.querySelector(`[data-action="${dir}"][data-id="${CSS.escape(String(id))}"]`);
      const other = list.querySelector(`[data-action="${dir === 'up' ? 'down' : 'up'}"][data-id="${CSS.escape(String(id))}"]`);
      (same && !same.disabled ? same : other)?.focus();
    }

    sortBtn.addEventListener('click', () => setSorting(!sorting));
    window.addEventListener('beforeunload', () => saveOrder.flush());

    /* ------------------------------------------------------------------- API */

    async function loadProducts() {
      renderSkeleton();
      try {
        const res = await fetch(`${API_URL}/products`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        products = data; // ya vienen en el orden guardado
        render();
      } catch (err) {
        console.error(err);
        countLabel.textContent = '';
        list.innerHTML = `
          <li class="py-10 text-center">
            <p class="text-ink">No pudimos cargar los productos.</p>
            <button type="button" data-action="retry" class="btn btn-outline mt-4">Reintentar</button>
          </li>`;
      }
    }

    async function send(method, path, body) {
      const res = await fetch(`${API_URL}${path}`, {
        method,
        headers: body ? { 'Content-Type': 'application/json' } : undefined,
        body: body ? JSON.stringify(body) : undefined
      });
      if (!res.ok) {
        const data = await res.json().catch(() => ({}));
        throw new Error(data.error || `HTTP ${res.status}`);
      }
      return res.status === 204 ? null : res.json().catch(() => null);
    }

    /* ----------------------------------------------------------------- Modal */

    function openModal(product) {
      lastFocused = document.activeElement;
      modalError.classList.add('hidden');
      productForm.reset();

      if (product) {
        modalTitle.textContent = 'Editar producto';
        productId.value = product.id;
        $('prodName').value = product.nombre;
        $('prodUnit').value = product.unidad;
        $('prodPrice').value = product.precio;
        flavors = [...(product.sabores || [])];
      } else {
        modalTitle.textContent = 'Nuevo producto';
        productId.value = '';
        flavors = [];
      }
      renderFlavors();
      fillFlavorSuggestions();

      modal.classList.remove('hidden');
      document.body.style.overflow = 'hidden';
      $('prodName').focus();
    }

    function closeModal() {
      modal.classList.add('hidden');
      document.body.style.overflow = '';
      lastFocused?.focus();
    }

    $('newBtn').addEventListener('click', () => openModal(null));
    $('cancelBtn').addEventListener('click', closeModal);
    $('modalBackdrop').addEventListener('click', closeModal);

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && !modal.classList.contains('hidden')) closeModal();
    });

    productForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      modalError.classList.add('hidden');

      const payload = {
        nombre: $('prodName').value.trim(),
        unidad: $('prodUnit').value.trim(),
        precio: Number($('prodPrice').value),
        sabores: flavors
      };

      // Un sabor escrito pero sin tocar + también cuenta.
      const pending = capitalize(flavorInput.value.trim().replace(/\s+/g, ' '));
      if (pending && !flavors.some((f) => f.toLocaleLowerCase('es') === pending.toLocaleLowerCase('es'))) {
        payload.sabores = [...flavors, pending];
      }

      if (!payload.nombre || !payload.unidad || !Number.isFinite(payload.precio)) {
        showFieldError(modalError, 'Completá todos los campos.');
        return;
      }

      const id = productId.value;
      saveBtn.disabled = true;
      saveBtn.textContent = 'Guardando…';

      try {
        if (id) await send('PUT', `/products/${id}`, payload);
        else await send('POST', '/products', payload);

        closeModal();
        showStatus(id ? 'Producto actualizado.' : 'Producto creado.');
        await loadProducts();
      } catch (err) {
        console.error(err);
        showFieldError(modalError, `No se pudo guardar: ${err.message}`);
      } finally {
        saveBtn.disabled = false;
        saveBtn.textContent = 'Guardar';
      }
    });

    /* -------------------------------------------------------- Acciones lista */

    list.addEventListener('click', async (e) => {
      const btn = e.target.closest('button[data-action]');
      if (!btn) return;

      const { action, id } = btn.dataset;

      if (action === 'retry') return loadProducts();
      if (action === 'up') return move(id, -1);
      if (action === 'down') return move(id, 1);

      const product = products.find((p) => String(p.id) === String(id));
      if (!product) return;

      if (action === 'edit') return openModal(product);

      if (action === 'delete') {
        if (!confirm(`¿Eliminar "${product.nombre}"? Esta acción no se puede deshacer.`)) return;
        try {
          await send('DELETE', `/products/${id}`);
          showStatus('Producto eliminado.');
          await loadProducts();
        } catch (err) {
          console.error(err);
          showStatus(`No se pudo eliminar: ${err.message}`, false);
        }
      }
    });

    searchInput.addEventListener('input', render);
  </script>
</body>

</html>
