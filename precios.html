<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Lista de precios — La Blanquita del Barrio</title>
  <meta name="description" content="Lista de precios vigente de La Blanquita del Barrio. Pastas frescas artesanales en Hurlingham y Haedo.">
  <meta name="theme-color" content="#EBE6DA">
  <link rel="icon" href="/assets/lb_logo_trim.png" type="image/png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/styles.css">
</head>

<body class="min-h-screen flex flex-col">

  <header class="sticky top-0 z-50 bg-crema/95 backdrop-blur-sm border-b border-rule">
    <div class="mx-auto max-w-3xl px-5 sm:px-8">
      <div class="flex items-center justify-between gap-4 py-3">
        <a href="/" class="flex items-center gap-3 shrink-0">
          <img src="/assets/lb_logo_trim.png" alt="" width="512" height="435" class="w-11 sm:w-13 h-auto">
          <span class="leading-none">
            <span class="display block text-[1.0625rem] sm:text-xl">La Blanquita del Barrio</span>
            <span class="eyebrow mt-1 block text-[0.625rem]">Pastas frescas artesanales</span>
          </span>
        </a>
        <a href="/" class="nav-link hidden sm:inline text-[0.9375rem]">&larr; Volver</a>
      </div>
    </div>
  </header>

  <main class="grow mx-auto w-full max-w-3xl px-5 sm:px-8 py-10 sm:py-16">

    <div class="text-center">
      <h1 class="display text-4xl sm:text-5xl">Lista de precios</h1>
      <div class="ornament mt-5 mx-auto max-w-[13rem]"><span></span></div>
    </div>

    <!-- Buscador: pegado bajo el header, porque la lista es larga -->
    <div class="sticky top-[4.25rem] z-40 -mx-5 sm:mx-0 px-5 sm:px-0 py-3 bg-offwhite/80 backdrop-blur-sm mt-8">
      <label for="searchInput" class="sr-only">Buscar productos</label>
      <div class="relative">
        <svg class="pointer-events-none absolute left-3.5 top-1/2 -translate-y-1/2 text-ink-3" width="17" height="17"
          viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
          <path fill-rule="evenodd"
            d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z"
            clip-rule="evenodd" />
        </svg>
        <input type="search" id="searchInput" class="field pl-10" placeholder="Buscar producto..." autocomplete="off">
      </div>
    </div>

    <p id="resultCount" class="eyebrow mt-4 h-4" aria-live="polite"></p>

    <!-- La misma lista sirve para móvil y escritorio: es un renglón de carta,
         no una tabla. Evita mantener dos renders en paralelo. -->
    <div class="panel mt-3 px-5 sm:px-8 py-2 sm:py-4">
      <ul id="priceList" class="divide-y divide-rule/60"></ul>
    </div>

    <p class="prose-warm mt-6 text-sm text-center">
      Consultá disponibilidad en el mostrador.
    </p>

    <div class="mt-10 text-center">
      <a href="/#sucursales" class="btn btn-outline">Ver sucursales y horarios</a>
    </div>
  </main>

  <footer class="border-t border-rule bg-crema">
    <div class="mx-auto max-w-3xl px-5 sm:px-8 py-8 flex flex-col sm:flex-row items-center justify-between gap-4">
      <p class="text-xs text-ink-3">© <span id="year">2026</span> La Blanquita del Barrio</p>
      <a href="/" class="nav-link text-sm">Volver al inicio</a>
    </div>
  </footer>

  <script type="module">
    const API_URL = import.meta.env.VITE_API_URL || 'http://localhost:3000';

    const list = document.getElementById('priceList');
    const countLabel = document.getElementById('resultCount');
    const searchInput = document.getElementById('searchInput');

    document.getElementById('year').textContent = String(new Date().getFullYear());

    let allProducts = [];

    const money = new Intl.NumberFormat('es-AR', {
      style: 'currency',
      currency: 'ARS',
      maximumFractionDigits: 0
    });

    // Los nombres vienen del panel de administración; se escapan igual antes
    // de tocar innerHTML.
    const esc = (value) =>
      String(value ?? '').replace(/[&<>"']/g, (c) => (
        { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
      ));

    const notice = (text, tone = 'text-ink-3') =>
      `<li class="py-10 text-center ${tone}">${esc(text)}</li>`;

    function renderSkeleton() {
      list.innerHTML = Array.from({ length: 8 }, () => `
        <li class="py-4 animate-pulse">
          <div class="flex items-baseline gap-4">
            <div class="h-3.5 bg-rule/50 rounded w-2/5"></div>
            <div class="h-3.5 bg-rule/30 rounded flex-1"></div>
            <div class="h-3.5 bg-rule/50 rounded w-16"></div>
          </div>
        </li>
      `).join('');
    }

    function render(products) {
      countLabel.textContent = allProducts.length
        ? `${products.length} ${products.length === 1 ? 'producto' : 'productos'}`
        : '';

      if (!products.length) {
        list.innerHTML = notice('No encontramos productos con ese nombre.');
        return;
      }

      list.innerHTML = products.map((p) => `
        <li class="leader py-4">
          <span class="min-w-0">
            <span class="block text-ink">${esc(p.nombre)}</span>
            <span class="eyebrow mt-1 block">${esc(p.unidad)}</span>
          </span>
          <span class="leader-fill"></span>
          <span class="display tnum text-lg text-brand shrink-0">${esc(money.format(p.precio))}</span>
        </li>
      `).join('');
    }

    function renderError() {
      countLabel.textContent = '';
      list.innerHTML = `
        <li class="py-10 text-center">
          <p class="text-ink">No pudimos cargar la lista de precios.</p>
          <p class="prose-warm mt-1 text-sm">Revisá tu conexión e intentá de nuevo.</p>
          <button type="button" id="retryBtn" class="btn btn-outline mt-5">Reintentar</button>
        </li>`;
      document.getElementById('retryBtn').addEventListener('click', load);
    }

    function applyFilter() {
      const term = searchInput.value.trim().toLowerCase();
      render(term
        ? allProducts.filter((p) => String(p.nombre).toLowerCase().includes(term))
        : allProducts);
    }

    async function load() {
      renderSkeleton();
      try {
        const res = await fetch(`${API_URL}/products`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);

        const data = await res.json();
        allProducts = data.sort((a, b) => a.nombre.localeCompare(b.nombre, 'es'));

        if (!allProducts.length) {
          countLabel.textContent = '';
          list.innerHTML = notice('Todavía no hay productos cargados.');
          return;
        }
        applyFilter();
      } catch (error) {
        console.error('Error cargando precios:', error);
        renderError();
      }
    }

    searchInput.addEventListener('input', applyFilter);
    load();
  </script>
</body>

</html>
