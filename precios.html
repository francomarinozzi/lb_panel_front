<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Lista de precios — La Blanquita del Barrio</title>
  <meta name="description" content="Lista de precios vigente de La Blanquita del Barrio. Pastas frescas artesanales en Hurlingham y Haedo.">
  <meta name="theme-color" content="#EBE6DA">
  <link rel="icon" href="/assets/lb_logo_trim.png" type="image/png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Kalam:wght@400;700&family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/styles.css">
</head>

<body class="min-h-screen flex flex-col">

  <header id="siteHeader" class="site-header sticky top-0 z-50 bg-crema/95 backdrop-blur-sm border-b border-rule">
    <div class="mx-auto max-w-3xl px-4 sm:px-8">
      <div class="flex items-center justify-between gap-4 py-3">
        <a href="/" class="flex items-center gap-3 shrink-0">
          <img src="/assets/lb_logo_trim.png" alt="" width="512" height="435" class="w-11 sm:w-13 h-auto">
          <span class="leading-none">
            <span class="display block text-[1.0625rem] sm:text-xl">La Blanquita del Barrio</span>
            <span class="eyebrow mt-1 block text-[0.625rem]">Pastas frescas artesanales</span>
          </span>
        </a>
        <a href="/" class="nav-link text-[0.9375rem] whitespace-nowrap shrink-0">&larr; Volver</a>
      </div>
    </div>
  </header>

  <!-- Tenedor con spaghetti enroscado; de ahí cuelga un fideo que se estira
       con el scroll. Lo arma el JS. Decorativo: el lector de pantalla lo ignora. -->
  <svg id="noodle" class="noodle" aria-hidden="true" focusable="false"></svg>

  <main class="grow mx-auto w-full max-w-[36rem] px-2.5 sm:px-0 pt-6 pb-12 sm:pt-12 sm:pb-20">

    <!-- ================================================================
         Pizarra
         ================================================================ -->
    <section class="board" aria-labelledby="boardTitle">
      <div class="slate pl-8 pr-5 pt-7 pb-6 sm:px-10 sm:pt-9 sm:pb-8">

        <div class="text-center">
          <p class="chalk-script chalk-pink text-xl leading-none">Pastas frescas</p>
          <h1 id="boardTitle" class="chalk-script text-[3.25rem] sm:text-6xl font-bold leading-[0.95] mt-2">
            Lista de precios
          </h1>
          <!-- Subrayado de tiza -->
          <svg class="chalk-underline mx-auto mt-1 w-48 h-4" viewBox="0 0 200 16" fill="none" aria-hidden="true">
            <path pathLength="1" d="M4 10 C 40 4, 70 13, 105 8 S 170 5, 196 9" stroke="#f5d97c" stroke-width="3"
              stroke-linecap="round" opacity="0.9" />
          </svg>
          <p id="updatedAt" class="chalk-script chalk-dim text-lg mt-1 min-h-6" aria-live="polite"></p>
        </div>

        <div class="relative mt-5">
          <label for="searchInput" class="sr-only">Buscar productos</label>
          <svg class="pointer-events-none absolute left-3.5 top-1/2 -translate-y-1/2 text-[#f3efe6]/50" width="17"
            height="17" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
            <path fill-rule="evenodd"
              d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z"
              clip-rule="evenodd" />
          </svg>
          <input type="search" id="searchInput" class="chalk-search" placeholder="¿Qué andás buscando?" autocomplete="off"
            enterkeyhint="search">
        </div>

        <p id="resultCount" class="chalk-script chalk-dim text-lg mt-3 text-right min-h-6" aria-live="polite"></p>

        <ul id="priceList" class="mt-1"></ul>
      </div>
      <div class="tray" aria-hidden="true"></div>
    </section>

    <!-- En móvil, margen lateral amplio: el fideo cuelga por la izquierda. -->
    <p class="prose-warm mt-7 px-14 sm:px-3 text-sm text-center">
      Consultá disponibilidad en el mostrador.
    </p>

    <div class="mt-6 flex flex-col sm:flex-row gap-3 justify-center px-14 sm:px-3">
      <a href="/#pedidos" class="btn btn-brand">Hacé tu pedido</a>
      <a href="/#sucursales" class="btn btn-outline">Sucursales y horarios</a>
    </div>
  </main>

  <footer class="border-t border-rule bg-crema">
    <div class="mx-auto max-w-3xl px-5 sm:px-8 py-8 flex flex-col sm:flex-row items-center justify-between gap-4">
      <p class="text-xs text-ink-3">© <span id="year">2026</span> La Blanquita del Barrio</p>
      <a href="/" class="nav-link text-sm">Volver al inicio</a>
    </div>
  </footer>

  <script type="module">
    const API_URL = import.meta.env.VITE_API_URL || 'http://localhost:3000';

    const list = document.getElementById('priceList');
    const countLabel = document.getElementById('resultCount');
    const searchInput = document.getElementById('searchInput');
    const updatedLabel = document.getElementById('updatedAt');

    document.getElementById('year').textContent = String(new Date().getFullYear());

    let allProducts = [];
    let firstRender = true;

    const money = new Intl.NumberFormat('es-AR', {
      style: 'currency',
      currency: 'ARS',
      maximumFractionDigits: 0
    });

    const longDate = new Intl.DateTimeFormat('es-AR', { day: 'numeric', month: 'long', year: 'numeric' });

    // Los nombres vienen del panel de administración; se escapan igual antes
    // de tocar innerHTML.
    const esc = (value) =>
      String(value ?? '').replace(/[&<>"']/g, (c) => (
        { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
      ));

    // Resalta la coincidencia de la búsqueda. Corta sobre el texto crudo y
    // escapa cada pedazo por separado.
    function highlight(text, term) {
      const raw = String(text ?? '');
      if (!term) return esc(raw);
      const i = raw.toLowerCase().indexOf(term);
      if (i < 0) return esc(raw);
      return esc(raw.slice(0, i)) + '<mark>' + esc(raw.slice(i, i + term.length)) + '</mark>' + esc(raw.slice(i + term.length));
    }

    const notice = (text) =>
      `<li class="chalk py-10 text-center text-lg chalk-dim">${esc(text)}</li>`;

    function renderSkeleton() {
      list.innerHTML = Array.from({ length: 7 }, () => `
        <li class="chalk-row animate-pulse">
          <div class="flex items-end gap-3">
            <div class="h-4 rounded bg-white/15 w-2/5"></div>
            <div class="flex-1"></div>
            <div class="h-5 rounded bg-white/15 w-20"></div>
          </div>
          <div class="h-3 rounded bg-white/10 w-14 mt-2"></div>
        </li>
      `).join('');
    }

    function render(products, term = '') {
      countLabel.textContent = allProducts.length
        ? `${products.length} ${products.length === 1 ? 'producto' : 'productos'}`
        : '';

      if (!products.length) {
        list.innerHTML = notice('No encontramos esa pasta.');
        noodle.refresh();
        return;
      }

      // La "escritura" de cada renglón solo en la primera carga: re-animar en
      // cada tecla del buscador cansa.
      const animate = firstRender;
      firstRender = false;

      list.innerHTML = products.map((p, i) => `
        <li class="chalk-row ${animate ? 'chalk-in' : ''}" style="--i:${Math.min(i, 12)}">
          <div class="leader">
            <span class="chalk text-[1.1875rem] leading-snug min-w-0">${highlight(p.nombre, term)}</span>
            <span class="leader-fill"></span>
            <span class="chalk-script chalk-yellow font-bold text-[1.9rem] leading-none shrink-0 tnum">${esc(money.format(p.precio))}</span>
          </div>
          <span class="chalk-script chalk-pink text-lg leading-none block mt-1">${esc(p.unidad)}</span>
          ${p.sabores?.length ? `
          <ul class="flavor-list" aria-label="Sabores de ${esc(p.nombre)}">
            ${p.sabores.map((f) => `<li class="chalk-chip">${highlight(f, term)}</li>`).join('')}
          </ul>` : ''}
        </li>
      `).join('');
      noodle.refresh();
    }

    function renderError() {
      countLabel.textContent = '';
      list.innerHTML = `
        <li class="py-10 text-center">
          <p class="chalk text-lg">No pudimos cargar la lista de precios.</p>
          <p class="chalk chalk-dim mt-1">Revisá tu conexión e intentá de nuevo.</p>
          <button type="button" id="retryBtn" class="chalk mt-5 px-5 py-2 rounded-lg border-2 border-dashed border-white/40 hover:border-[#f5d97c] hover:text-[#f5d97c]">Reintentar</button>
        </li>`;
      document.getElementById('retryBtn').addEventListener('click', load);
      noodle.refresh();
    }

    function applyFilter() {
      const term = searchInput.value.trim().toLowerCase();
      render(term
        ? allProducts.filter((p) => String(p.nombre).toLowerCase().includes(term)
          || (p.sabores || []).some((f) => f.toLowerCase().includes(term)))
        : allProducts, term);
    }

    async function load() {
      renderSkeleton();
      try {
        const res = await fetch(`${API_URL}/products`);
        // El backend responde 404 cuando la tabla está vacía.
        if (res.status === 404) {
          allProducts = [];
          countLabel.textContent = '';
          list.innerHTML = notice('Todavía no hay productos cargados.');
          return;
        }
        if (!res.ok) throw new Error(`HTTP ${res.status}`);

        const data = await res.json();
        allProducts = data.sort((a, b) => a.nombre.localeCompare(b.nombre, 'es'));

        const latest = Math.max(...allProducts.map((p) => Date.parse(p.updatedAt) || 0));
        updatedLabel.textContent = latest ? `actualizada el ${longDate.format(latest)}` : '';

        applyFilter();
      } catch (error) {
        console.error('Error cargando precios:', error);
        renderError();
      }
    }

    /* ======================================================================
       Tenedor + fideo
       Arriba, un tenedor con spaghetti enroscado en los dientes (el mango se
       pierde detrás del header, como si alguien lo sostuviera). De ahí cuelga
       un manojo de 4 hebras de largos distintos que se estiran al bajar:
       crecen, se afinan y la onda se afloja (la masa tirante cae más derecha).
       Si se scrollea rápido, se bambolean.

       Cada hebra es un polígono con volumen (no un trazo): contorno, luz de
       un lado y sombra del otro según la normal real de la curva.
       ====================================================================== */
    const noodle = (() => {
      const NS = 'http://www.w3.org/2000/svg';
      const svg = document.getElementById('noodle');
      const header = document.getElementById('siteHeader');
      const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

      const el = (name, attrs = {}, parent) => {
        const node = document.createElementNS(NS, name);
        for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
        if (parent) parent.appendChild(node);
        return node;
      };

      // Paleta de pasta cocida: dorado pálido y mate, no amarillo "marcador".
      const PASTA = {
        edge: '#bf9a55',
        base: '#ecd59a',
        shade: '#d9b970',
        light: '#fbf1d2',
      };

      // ---- Armado del SVG ----------------------------------------------
      const defs = el('defs', {}, svg);
      const silver = el('linearGradient', { id: 'forkSilver', x1: '0', x2: '1', y1: '0', y2: '0' }, defs);
      [['0', '#7f8890'], ['0.32', '#eef2f5'], ['0.55', '#b9c1c8'], ['1', '#6f7880']].forEach(([o, c]) =>
        el('stop', { offset: o, 'stop-color': c }, silver));
      const shadow = el('filter', { id: 'pastaShadow', x: '-50%', y: '-10%', width: '200%', height: '120%' }, defs);
      el('feDropShadow', { dx: '1.2', dy: '2.5', stdDeviation: '1.4', 'flood-color': '#2b241d', 'flood-opacity': '0.3' }, shadow);

      const scene = el('g', { filter: 'url(#pastaShadow)' }, svg);

      // Tenedor en unidades locales (64 de ancho); se escala aparte.
      const forkG = el('g', {}, scene);
      const backCoils = el('g', {}, forkG);
      const forkBody = el('g', { fill: 'url(#forkSilver)', stroke: '#5f676e', 'stroke-width': '0.6' }, forkG);
      el('rect', { x: 28, y: -80, width: 8, height: 94, rx: 3 }, forkBody);
      el('path', { d: 'M28 12 C28 21 18 20 18 29 L46 29 C46 20 36 21 36 12 Z' }, forkBody);
      [18, 25.7, 33.3, 41].forEach((x) => el('rect', { x, y: 27, width: 5, height: 27, rx: 2.5 }, forkBody));

      // Plato del final (unidades locales: 120 de ancho). El fondo va detrás
      // de las hebras y la pasta servida delante, así las puntas quedan
      // tapadas, como si cayeran adentro.
      const rimGrad = el('linearGradient', { id: 'plateRim', x1: '0', x2: '0', y1: '0', y2: '1' }, defs);
      [['0', '#ffffff'], ['1', '#e9e4da']].forEach(([o, c]) => el('stop', { offset: o, 'stop-color': c }, rimGrad));
      const wellGrad = el('linearGradient', { id: 'plateWell', x1: '0', x2: '0', y1: '0', y2: '1' }, defs);
      [['0', '#e2dccf'], ['0.45', '#f6f3ec'], ['1', '#fbfaf6']].forEach(([o, c]) => el('stop', { offset: o, 'stop-color': c }, wellGrad));

      const plateBack = el('g', { opacity: '0' }, scene);
      el('ellipse', { cx: 60, cy: 36, rx: 38, ry: 6.5, fill: '#cdc8be' }, plateBack);
      el('ellipse', { cx: 60, cy: 27, rx: 58, ry: 15, fill: 'url(#plateRim)', stroke: '#c9c3b8', 'stroke-width': 0.8 }, plateBack);
      el('ellipse', { cx: 60, cy: 27, rx: 52, ry: 12.8, fill: 'none', stroke: '#b98d52', 'stroke-width': 0.9, opacity: 0.75 }, plateBack);
      el('ellipse', { cx: 60, cy: 27.5, rx: 41, ry: 10, fill: 'url(#plateWell)', stroke: '#ddd7cc', 'stroke-width': 0.8 }, plateBack);

      // Hebras que cuelgan: van entre las vueltas de atrás y las de adelante,
      // así parecen salir de adentro del ovillo.
      const strandsG = el('g', {}, scene);
      const plateFront = el('g', { opacity: '0' }, scene);
      const frontCoils = el('g', {}, forkG);

      // Cada hebra: polígono con volumen (cuerpo + borde), una línea de sombra
      // de un lado y una de luz del otro. La luz viene siempre de la izquierda
      // porque se calcula con la normal real de la curva.
      const makeStrand = (parent) => ({
        body: el('path', { fill: PASTA.base, stroke: PASTA.edge, 'stroke-width': '0.9', 'stroke-linejoin': 'round' }, parent),
        shade: el('path', { fill: 'none', stroke: PASTA.shade, 'stroke-linecap': 'round', opacity: '0.75' }, parent),
        light: el('path', { fill: 'none', stroke: PASTA.light, 'stroke-linecap': 'round', opacity: '0.9' }, parent),
      });

      // Manojo de 4 hebras con largos, fases y ondas distintas.
      const STRANDS = [
        { dx: 5, ph: 2.1, f: 1 / 47, a: 0.9, len: 0.94, w: 0.95 },
        { dx: -6, ph: 0.0, f: 1 / 39, a: 1.0, len: 1.0, w: 1 },
        { dx: 1.5, ph: 4.2, f: 1 / 52, a: 0.75, len: 0.8, w: 0.9 },
        { dx: -1.5, ph: 1.0, f: 1 / 35, a: 1.1, len: 0.88, w: 1 },
      ].map((cfg) => ({ ...cfg, parts: makeStrand(strandsG) }));

      // Ovillo enroscado en los dientes: vueltas finas, cada una partida al
      // medio (la mitad de arriba detrás de los dientes, la de abajo delante).
      const COILS = [
        { y: 31, rx: 17, ry: 4.2, rot: -9 },
        { y: 34.5, rx: 19.5, ry: 4.8, rot: 6 },
        { y: 38, rx: 20.5, ry: 5, rot: -3 },
        { y: 41.5, rx: 19.5, ry: 4.8, rot: 8 },
        { y: 45, rx: 18.5, ry: 4.6, rot: -6 },
        { y: 48.5, rx: 15.5, ry: 4.2, rot: 4 },
      ];
      const coilLayer = (parent, d) => {
        el('path', { d, fill: 'none', stroke: PASTA.edge, 'stroke-width': 6.2, 'stroke-linecap': 'round' }, parent);
        el('path', { d, fill: 'none', stroke: PASTA.base, 'stroke-width': 4.6, 'stroke-linecap': 'round' }, parent);
        el('path', { d, fill: 'none', stroke: PASTA.light, 'stroke-width': 1.3, 'stroke-linecap': 'round', opacity: '0.85', transform: 'translate(0 -1)' }, parent);
      };
      COILS.forEach((c) => {
        const tr = `rotate(${c.rot} 32 ${c.y})`;
        coilLayer(el('g', { transform: tr }, backCoils), `M ${32 - c.rx} ${c.y} A ${c.rx} ${c.ry} 0 0 1 ${32 + c.rx} ${c.y}`);
        coilLayer(el('g', { transform: tr }, frontCoils), `M ${32 + c.rx} ${c.y} A ${c.rx} ${c.ry} 0 0 1 ${32 - c.rx} ${c.y}`);
      });
      const NEST_BOTTOM = 49; // de acá salen las hebras, en unidades locales

      // Pasta servida en el plato: una montañita de vueltas, salsa y albahaca.
      const ring = (cx, cy, rx, ry) =>
        `M ${cx - rx} ${cy} a ${rx} ${ry} 0 1 0 ${2 * rx} 0 a ${rx} ${ry} 0 1 0 ${-2 * rx} 0`;
      [
        { y: 28, rx: 24, ry: 6, rot: -4 },
        { y: 25, rx: 21, ry: 5.5, rot: 6 },
        { y: 22.5, rx: 17, ry: 5, rot: -7 },
        { y: 20, rx: 12, ry: 4, rot: 5 },
      ].forEach((c) => coilLayer(el('g', { transform: `rotate(${c.rot} 60 ${c.y})` }, plateFront), ring(60, c.y, c.rx, c.ry)));
      el('path', { d: 'M50 17 C50 12 56 10 61 11 C67 10 72 13 70 17 C69 20 63 21 58 20.5 C53 21 50 20 50 17 Z', fill: '#b8321f' }, plateFront);
      el('ellipse', { cx: 57, cy: 14, rx: 3.2, ry: 1.2, fill: '#e2674c', opacity: 0.85 }, plateFront);
      el('path', { d: 'M62 13 C66 7 73 7 76 9 C73 13 67 15 62 13 Z', fill: '#3d7a35' }, plateFront);
      el('path', { d: 'M62 13 C67 11 71 10 76 9', fill: 'none', stroke: '#2a5a25', 'stroke-width': 0.6 }, plateFront);
      const PILE = { x: 60, y: 22 }; // donde aterrizan las puntas, unidades del plato

      // ---- Estado --------------------------------------------------------
      const desktopMQ = matchMedia('(min-width: 48rem)');
      let w = 0, h = 0, s = 1, narrow = true, maxScroll = 1;
      // Franja del fideo dentro del SVG (el SVG es más ancho por el plato).
      let ox = 0, stripW = 52, cx = 26;
      let shown = 0, wobble = 0, phase = 0, lastY = scrollY, raf = 0;
      // Plato: progreso suavizado (0 = afuera a la izquierda, 1 = en su lugar).
      let plateP = 0, ps = 1, plateFinalX = 0, plateY = 0;
      let pileX = 0, pileY = 0, plateIn = 0;

      function measure() {
        // Un <svg> no se estira con top+bottom como un div: el alto va explícito.
        svg.style.top = `${header.offsetHeight}px`;
        svg.style.height = `${Math.max(0, innerHeight - header.offsetHeight - 10)}px`;
        const r = svg.getBoundingClientRect();
        w = r.width;
        h = r.height;
        narrow = !desktopMQ.matches;
        stripW = narrow ? 52 : 64;
        ox = narrow ? 0 : 68;
        cx = ox + stripW / 2;
        // El tenedor se escala aparte de la franja: en móvil la franja es
        // angosta, pero el tenedor tiene que leerse como tenedor.
        s = narrow ? 0.95 : 1.15;
        svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
        forkG.setAttribute('transform', `translate(${(cx - 32 * s).toFixed(2)} 0) scale(${s})`);
        // Plato centrado justo debajo del tenedor, así los fideos caen derecho.
        // En móvil queda medio cortado por el borde izquierdo, a propósito.
        ps = narrow ? 1 : 1.25;
        plateFinalX = cx - 60 * ps;
        plateY = h - 42 * ps - 2;
        maxScroll = Math.max(0, document.documentElement.scrollHeight - innerHeight);
      }

      const target = () => (maxScroll ? Math.min(1, Math.max(0, scrollY / maxScroll)) : 0);

      function placePlate() {
        const hiddenX = -120 * ps - 30;
        const x = hiddenX + (plateFinalX - hiddenX) * plateP;
        const tr = `translate(${x.toFixed(2)} ${plateY.toFixed(2)}) scale(${ps})`;
        const visible = plateP > 0.002 ? '1' : '0';
        plateBack.setAttribute('transform', tr);
        plateFront.setAttribute('transform', tr);
        plateBack.setAttribute('opacity', visible);
        plateFront.setAttribute('opacity', visible);
        pileX = x + PILE.x * ps;
        pileY = plateY + PILE.y * ps;
        plateIn = Math.min(1, Math.max(0, plateP));
      }

      // Línea central de una hebra, en puntos cada ~4px.
      function centerline(cfg, length, y0, half) {
        const room = stripW / 2 - half - 1;
        const spread = narrow ? 0.8 : 1.1;
        // Al estirarse, la onda se afloja: la masa tirante cae más derecha.
        const amp = room * 0.42 * cfg.a * (1 - 0.55 * shown);
        const pts = [];
        for (let y = 0; ; y += 4) {
          const yy = Math.min(y, length);
          const ease = Math.min(1, yy / 70);          // sale derecha del ovillo
          const swing = Math.sin(yy / 24 - phase + cfg.ph) * wobble * Math.min(1, yy / Math.max(1, length)) * room * 0.8;
          let x = cx
            + cfg.dx * spread * (0.55 + 0.45 * ease)
            + Math.sin(yy * cfg.f + cfg.ph) * amp * ease
            + Math.sin(yy / 170 + cfg.ph * 0.5) * room * 0.18 * ease
            + swing;
          x = Math.max(ox + half + 1, Math.min(ox + stripW - half - 1, x));
          // Con el plato adentro, el último tramo se tuerce hacia la pasta
          // servida: las puntas caen en el plato y lo siguen si se mueve.
          if (plateIn > 0) {
            const u = Math.min(1, Math.max(0, (yy - (length - 110)) / 110));
            const k = u * u * (3 - 2 * u) * plateIn;
            x += (pileX + cfg.dx * 0.7 - x) * k;
          }
          pts.push([x, yy + y0]);
          if (yy >= length) break;
        }
        return pts;
      }

      const fmt = ([x, y]) => `${x.toFixed(2)} ${y.toFixed(2)}`;

      // Contorno con volumen: desplaza la línea central por la normal, con un
      // leve afinado hacia la punta, y cierra con una punta redondeada.
      function drawStrand(cfg, length, y0, baseHalf) {
        const pts = centerline(cfg, length, y0, baseHalf);
        if (pts.length < 2) return;
        const n = pts.length;
        const L = [], R = [], lightPts = [], shadePts = [];
        let half = baseHalf;
        for (let i = 0; i < n; i++) {
          const a = pts[Math.max(0, i - 1)];
          const b = pts[Math.min(n - 1, i + 1)];
          let tx = b[0] - a[0], ty = b[1] - a[1];
          const len = Math.hypot(tx, ty) || 1;
          tx /= len; ty /= len;
          const nx = -ty, ny = tx;                    // normal hacia la izquierda al bajar
          half = baseHalf * (1 - 0.18 * (i / (n - 1)));
          const [x, y] = pts[i];
          L.push([x + nx * half, y + ny * half]);
          R.push([x - nx * half, y - ny * half]);
          if (i < n - 2) {
            lightPts.push([x + nx * half * 0.38, y + ny * half * 0.38]);
            shadePts.push([x - nx * half * 0.45, y - ny * half * 0.45]);
          }
        }
        const lastR = R[n - 1];
        const d = `M ${L.map(fmt).join(' L ')} A ${half.toFixed(2)} ${half.toFixed(2)} 0 0 0 ${fmt(lastR)} L ${R.reverse().map(fmt).join(' L ')} Z`;
        cfg.parts.body.setAttribute('d', d);
        cfg.parts.light.setAttribute('d', lightPts.length > 1 ? `M ${lightPts.map(fmt).join(' L ')}` : '');
        cfg.parts.light.setAttribute('stroke-width', (half * 0.55).toFixed(2));
        cfg.parts.shade.setAttribute('d', shadePts.length > 1 ? `M ${shadePts.map(fmt).join(' L ')}` : '');
        cfg.parts.shade.setAttribute('stroke-width', (half * 0.5).toFixed(2));
      }

      function draw() {
        const y0 = NEST_BOTTOM * s - 4;
        const avail = h - y0;
        const baseHalf = (narrow ? 2.5 : 3.4) * (1 - 0.2 * shown); // se afina al estirarse
        placePlate();
        // Con el plato, el largo máximo es justo hasta la pasta servida.
        const land = pileY - y0;
        const limit = (avail - 6) + (land - (avail - 6)) * plateIn;
        const full = Math.min(limit, Math.max(22, shown * (avail - 6))); // siempre asoma un poco
        STRANDS.forEach((cfg) => {
          // Las hebras cortas se completan para caer todas en el plato.
          const lenF = cfg.len + (1 - cfg.len) * plateIn;
          drawStrand(cfg, full * lenF, y0, baseHalf * cfg.w);
        });
      }

      // El plato acompaña el scroll en el último tramo de la página (no se
      // dispara de golpe): entra del 82% al 100% con una curva suave, y si se
      // vuelve a subir, sale por el mismo camino.
      const PLATE_FROM = 0.82;
      const plateTarget = (tg) => {
        const u = Math.min(1, Math.max(0, (tg - PLATE_FROM) / (1 - PLATE_FROM)));
        return u * u * (3 - 2 * u);
      };

      function tick() {
        const tg = target();
        const pt = plateTarget(tg);
        if (reduceMotion) {
          shown = tg;
          wobble = 0;
          plateP = pt;
        } else {
          shown += (tg - shown) * 0.12;
          wobble *= 0.95;
          phase += 0.12;
          // Suavizado sin rebote: se acerca a su lugar sin pasarse.
          plateP += (pt - plateP) * 0.12;
        }
        draw();
        const settled = Math.abs(tg - shown) < 0.0005 && wobble < 0.01
          && Math.abs(pt - plateP) < 0.001;
        raf = settled ? 0 : requestAnimationFrame(tick);
      }

      const kick = () => { if (!raf) raf = requestAnimationFrame(tick); };

      addEventListener('scroll', () => {
        const v = Math.abs(scrollY - lastY);
        lastY = scrollY;
        if (!reduceMotion) wobble = Math.min(0.6, wobble + v / 600);
        kick();
      }, { passive: true });

      addEventListener('resize', () => { measure(); kick(); });

      measure();
      shown = target();
      plateP = plateTarget(shown);
      draw();

      // El alto de la página cambia cuando llega la lista o se filtra.
      return { refresh() { requestAnimationFrame(() => { measure(); kick(); }); } };
    })();

    const siteHeader = document.getElementById('siteHeader');
    const markScrolled = () => { siteHeader.dataset.scrolled = String(scrollY > 8); };
    addEventListener('scroll', markScrolled, { passive: true });
    markScrolled();

    searchInput.addEventListener('input', applyFilter);
    load();
  </script>
</body>

</html>
